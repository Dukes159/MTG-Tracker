<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a Profile - MTG Collection Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='theme.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container d-flex align-items-center">
            <span class="navbar-brand">MTG Collection Tracker</span>
            <button type="button" class="btn btn-outline-light ms-auto" data-theme-toggle>Dark theme</button>
        </div>
    </nav>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <h1 class="h2 text-center mb-2">Who’s collecting?</h1>
                <p class="text-muted text-center mb-4">Choose a collection or create a new profile.</p>

                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                {% if profiles %}
                <div class="card shadow-sm mb-4">
                    <div class="card-header fw-semibold">Choose a profile</div>
                    <div class="list-group list-group-flush">
                        {% for profile in profiles %}
                        <form action="/profiles/select" method="post" class="list-group-item">
                            <input type="hidden" name="profile_id" value="{{ profile.id }}">
                            <button type="submit" class="btn btn-link link-dark text-decoration-none p-0 w-100 text-start">
                                <span class="d-flex justify-content-between align-items-center">
                                    <span>{{ profile.name }}</span>
                                    <span class="text-primary">Open collection →</span>
                                </span>
                            </button>
                        </form>
                        {% endfor %}
                    </div>
                </div>
                {% endif %}

                <div class="card shadow-sm">
                    <div class="card-header fw-semibold">Create a new profile</div>
                    <div class="card-body">
                        <form action="/profiles/create" method="post">
                            <label for="profile-name" class="form-label">Name</label>
                            <div class="input-group">
                                <input id="profile-name" name="name" class="form-control" maxlength="40" required placeholder="Enter a name">
                                <button type="submit" class="btn btn-primary">Create profile</button>
                            </div>
                            <div class="form-text">Each profile has its own card collection.</div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
